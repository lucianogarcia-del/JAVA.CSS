<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS_JAVA SCRIPT</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header>
        <h1>Trocar a imagem ao passar o mouser!</h1>
    </header>
    <section>
        <figure id="fig1">
            <img src="./img/Buu.webp" alt="Buu" 
            onmouseover="this.src='./img/Kid.webp'"
            onmouseout="this.src='./img/Buu.webp'">
            
            <figcaption>
                Usando o mouseover/ mouseout
            </figcaption>
        </figure>

        <figure id="fig2">
           <img>
            <figcaption>
                Usando CSS
            </figcaption>
        </figure>
    </section>


</body>

</html>
